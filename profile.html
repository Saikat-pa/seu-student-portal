<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — SEU Student Portal</title>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="layout">
  <div id="config-banner" class="config-banner" hidden aria-live="polite"></div>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="Southeast University Student Portal home"></a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <nav class="nav nav--collapsible" id="main-nav" aria-label="Main">
        <a href="index.html" class="nav-link" data-page="index.html">Home</a>
        <a href="about.html" class="nav-link" data-page="about.html">About</a>
        <a href="dashboard.html" class="nav-link" data-page="dashboard.html">Dashboard</a>
        <a href="courses.html" class="nav-link" data-page="courses.html">Courses</a>
        <a href="notices.html" class="nav-link" data-page="notices.html">Notices</a>
        <a href="profile.html" class="nav-link" data-page="profile.html">Profile</a>
        <span id="nav-auth"></span>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="container">
      <header class="page-header">
        <h1 id="profile-heading">My profile</h1>
        <p id="profile-sub">View your student information. Upload or change your photo below.</p>
      </header>

      <section class="card profile-card">
        <div class="profile-card__top">
          <div id="profile-avatar-wrap" class="profile-avatar-wrap"></div>
          <div class="profile-photo-actions">
            <label class="btn btn--primary btn--sm" for="avatar-input">Upload photo</label>
            <input type="file" id="avatar-input" accept="image/jpeg,image/png,image/webp,image/gif" hidden />
            <button type="button" class="btn btn--ghost btn--sm" id="avatar-remove" hidden>Remove photo</button>
            <p class="card-hint">JPG, PNG, WebP or GIF · max 2 MB</p>
          </div>
        </div>

        <dl class="profile-grid" id="profile-fields"></dl>

        <p id="profile-admin-note" class="card-hint" hidden>
          Administrators manage student records on the
          <a href="students.html">Students</a> page.
        </p>

        <div class="form-actions">
          <a href="dashboard.html" class="btn btn--ghost">Back to dashboard</a>
          <a href="students.html" class="btn btn--primary" id="profile-students-link" hidden>Manage students</a>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer"><div class="container"><p data-footer-brand></p></div></footer>
  <script type="module">
    import { initLayout } from './js/main.js';
    import { initProfilePage } from './js/profile.js';
    initLayout();
    initProfilePage();
  </script>
</body>
</html>
