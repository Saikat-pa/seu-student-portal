<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notices — SEU Student Portal</title>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="layout">
  <div id="config-banner" class="config-banner" hidden aria-live="polite"></div>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo" aria-label="Southeast University Student Portal home"></a>
      <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
      <nav class="nav nav--collapsible" id="main-nav" aria-label="Main">
        <a href="index.html" class="nav-link" data-page="index.html">Home</a>
        <a href="about.html" class="nav-link" data-page="about.html">About</a>
        <a href="dashboard.html" class="nav-link" data-page="dashboard.html">Dashboard</a>
        <a href="courses.html" class="nav-link" data-page="courses.html">Courses</a>
        <a href="notices.html" class="nav-link" data-page="notices.html">Notices</a>
        <a href="profile.html" class="nav-link" data-page="profile.html">Profile</a>
        <span id="nav-auth"></span>
      </nav>
    </div>
  </header>
  <main class="page">
    <div class="container">
      <header class="page-header">
        <h1>Notices</h1>
        <p id="notices-desc">Official announcements from the university portal.</p>
      </header>
      <div id="admin-notice-form-wrap" class="card" hidden>
        <h2 class="card__title">Post a notice (Admin)</h2>
        <form id="notice-form" novalidate>
          <div class="form-group form-group--full">
            <label for="notice-title">Title</label>
            <input type="text" id="notice-title" name="title" maxlength="120" required />
          </div>
          <div class="form-group form-group--full">
            <label for="notice-body">Message</label>
            <textarea id="notice-body" name="body" rows="4" maxlength="2000" required></textarea>
          </div>
          <label class="checkbox-label">
            <input type="checkbox" id="notice-pinned" name="is_pinned" />
            Pin to top
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn--primary">Publish notice</button>
          </div>
        </form>
      </div>
      <section class="card">
        <h2 class="card__title">All notices</h2>
        <ul class="notice-list" id="notice-list"></ul>
        <p class="empty-state" id="notice-empty" hidden>No notices yet.</p>
      </section>
    </div>
  </main>
  <footer class="site-footer"><div class="container"><p data-footer-brand></p></div></footer>
  <script type="module">
    import { initLayout } from './js/main.js';
    import { initNoticesPage } from './js/notices.js';
    initLayout();
    initNoticesPage();
  </script>
</body>
</html>
